name: Ansible Health
description: 'AnsibleHealth is a virtual-first, doctor-led telemedicine practice
  specializing in the management of COPD, congestive heart failure, and other chronic
  pulmonary and cardiac conditions from home. Serving patients across 50+ states, it
  combines virtual diagnosis and personalized treatment plans, remote patient
  monitoring of vitals like heart rate and blood oxygen, virtual physical therapy,
  smoking-cessation coaching, and medication and durable-medical-equipment ordering
  to reduce hospitalizations and emergency-room use. The practice accepts Medicare,
  Medicaid, and most major commercial insurance plans. It was surfaced as a portfolio
  company of Bessemer Venture Partners and added to the API Evangelist network; it
  publishes a patient-facing website but no public developer API surface at this time.'
